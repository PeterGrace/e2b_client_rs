[package]
name = "e2b-client"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version (CLM-0121): uuid 1.29 needs 1.89. CI checks
# it (`msrv` job); raising it is a minor release (README, "Versioning").
rust-version = "1.89"
description = "Async client for the E2B sandbox API: REST sandbox lifecycle plus envd process and filesystem services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PeterGrace/e2b_client_rs"
readme = "README.md"
keywords = ["e2b", "sandbox", "connect-rpc", "async"]
categories = ["api-bindings", "asynchronous"]
# Not published to crates.io yet.
publish = false

[lib]
name = "e2b_client"

# Every public item has rustdoc (CLM-0120) and a Debug impl (CLM-0179).
# CI's `clippy -D warnings` turns these warnings into errors.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[dependencies]
# Gzip-compresses uploads on the fly (the SDKs' `gzip=True` upload).
async-compression = { version = "0.4.42", features = ["tokio", "gzip"] }
# proto3 JSON `bytes` fields are base64 strings.
base64 = "0.23.1"
# Zero-copy buffers for Connect envelope decoding and command output.
bytes = "1.12.1"
# RFC 3339 timestamps in REST responses and file metadata (parsing only, no clock).
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
# encodeURIComponent-compatible encoding for the list metadata filter.
percent-encoding = "2.3.2"
# Stream combinators for request bodies (`stream::unfold`); `alloc` for
# `TryStreamExt::try_buffer_unordered`, which runs capped concurrent uploads.
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# HTTP/1.1 and HTTP/2 client over rustls; multipart for file uploads; `stream`
# for streamed request bodies (client-streaming Connect calls).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "http2", "rustls", "query", "stream"] }
# Keeps the API key and envd access token out of Debug output.
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 for the signatures on file URLs.
sha2 = "0.11.1"
# Error enum derive.
thiserror = "2.0.21"
# Deadlines on streams and stream opening; a background task (`rt`) and a
# bounded channel (`sync`) drive client-streaming calls; `io-util` for the
# `BufReader` under streamed uploads.
tokio = { version = "1.54.1", features = ["time", "rt", "sync", "io-util"] }
# Turns an AsyncRead into a byte stream for request bodies.
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
# URL building and form encoding.
url = "2.5.8"
# Random v4 UUIDs for the MCP gateway's access token, as the SDKs make it.
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
# Reads the live-test keys from the nearest .env without touching the process environment.
dotenvy = "0.15.7"
# `test-util` gives tests paused time (`start_paused`), so timer tests do not wait.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "test-util"] }
# Mock HTTP server for the REST and envd tests.
wiremock = "0.6.5"
